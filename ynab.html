<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="B.A.S.E"><meta name="theme-color" content="#6e1a35"><link rel="manifest" href="ynab-manifest.json"><link rel="apple-touch-icon" href="ynab-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#f5f5f8;--card:#fff;--tx:#1d1d2b;--mut:#6b6b80;--line:#e3e3ec;--acc:#2a2ac2;--side:#1c1c8f;--sideh:#3232d0;--rta:#a8d84a;--g:#2d7a1e;--pill:#e8e8ee;--y:#f5c518;--r:#e5473c;--gp:#bfe6a8;--sel:#dcdcfa;--sel2:#e4e4fb}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15151f;--card:#1e1e2b;--tx:#ececf5;--mut:#9a9ab0;--line:#30303f;--pill:#2c2c3b;--acc:#8b8bff;--sel:#2a2d5c;--sel2:#23264f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{display:flex;height:100%}
aside{width:240px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:12px;flex:none;z-index:20;transition:transform .2s}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;width:100%;text-align:left;font-weight:600;color:#fff;font-size:15px}
.nav.on{background:var(--sideh)}.nav:hover{background:rgba(255,255,255,.1)}
.plan{padding:6px 8px 14px}.plan b{font-size:16px;display:block}.plan small{opacity:.75}
.sec{display:flex;justify-content:space-between;padding:14px 12px 4px;font-weight:700;font-size:12px;letter-spacing:.04em;opacity:.9}
.acc{display:flex;justify-content:space-between;padding:6px 12px 6px 20px;width:100%;border-radius:8px;font-weight:600}
.acc.on{background:var(--sideh)}
.sbtn{background:rgba(255,255,255,.14);border-radius:8px;padding:9px;margin-top:8px;width:100%;font-weight:600;color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
.mnav{display:flex;align-items:center;gap:10px}
.circ{width:32px;height:32px;border:2px solid var(--acc);border-radius:50%;color:var(--acc);display:grid;place-items:center;font-weight:700}
.mo{font-size:20px;font-weight:700}
.rta{margin-left:16px;display:flex;align-items:center;gap:16px;padding:8px 14px;border-radius:10px;position:relative;background:var(--rta);color:#1d2b0c}
.rta.z{background:var(--pill);color:var(--tx)}.rta.n{background:var(--r);color:#fff}
.rta b{font-size:20px;display:block}.rta .ab{background:var(--g);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700}
.pop{position:absolute;top:100%;left:0;margin-top:8px;width:330px;background:var(--card);color:var(--tx);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:30;overflow:hidden}
.tabs{display:flex}.tabs button{flex:1;padding:12px;font-weight:600;color:var(--mut)}.tabs .on{color:var(--acc);border-bottom:2px solid var(--acc)}
.ai{display:flex;justify-content:space-between;padding:9px 14px;margin:4px 8px;border-radius:8px;background:var(--bg);color:var(--acc);width:calc(100% - 16px);font-weight:500}
.ai:hover{background:var(--pill)}
.chips{display:flex;gap:6px;padding:12px 20px 4px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:var(--pill);font-size:13px}.chip.on{background:var(--sel);color:var(--acc);outline:1px solid var(--acc)}.chip.red{background:var(--r);color:#fff}
.bar{display:flex;gap:16px;padding:10px 20px;color:var(--acc);font-weight:600;align-items:center;flex-wrap:wrap}
.bar button:disabled{opacity:.4;cursor:default}.bar .sp{flex:1}
.body{flex:1;display:flex;min-height:0}
.tbl{flex:1;overflow:auto;min-width:0}
.row{display:grid;grid-template-columns:minmax(160px,1fr) 110px 110px 120px;align-items:center;padding:0 16px;min-height:44px;border-bottom:1px solid var(--line);background:var(--card);cursor:default}
.row.h{position:sticky;top:0;z-index:2;font-size:11px;letter-spacing:.06em;color:var(--mut);background:var(--bg);min-height:34px}
.row.g{background:var(--bg);font-weight:700}
.row.sel{background:var(--sel);outline:none}
.row>span:nth-child(n+2){text-align:right}
.nm{display:flex;align-items:center;gap:8px;min-width:0}.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{opacity:0;color:var(--acc);font-weight:700;font-size:18px}.row:hover .pl{opacity:1}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;background:var(--pill);min-width:74px;text-align:center}
.pill.g{background:var(--gp);color:#1d4a10}.pill.y{background:var(--y);color:#3b2f00;font-weight:600}.pill.r{background:var(--r);color:#fff;font-weight:600}
.ainp{width:96px;text-align:right;font:inherit;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;background:var(--card);color:var(--tx)}
.ins{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px}
.ins h3{margin:0 0 12px;font-size:18px;display:flex;gap:8px;align-items:center}
.box{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}.kv.b{color:var(--tx);font-weight:600}
.ring{width:64px;height:64px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-weight:700;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--pill) 0)}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal}
.ybox{background:#fbeeb3;color:#3b2f00;border-radius:10px;padding:12px;text-align:center;margin:8px 0}
.btn{background:var(--acc);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600}.btn.y{background:var(--y);color:#3b2f00;width:100%;margin-top:6px}.btn.l{background:var(--pill);color:var(--acc);width:100%}
.sum{font-weight:700;margin:0 0 6px}
.reg{flex:1;overflow:auto}
.hd{padding:16px 20px 4px;font-size:26px;font-weight:700}
.bal{display:flex;gap:14px;padding:8px 20px 12px;align-items:flex-end;flex-wrap:wrap}.bal div{color:var(--mut);font-size:12px}.bal b{display:block;font-size:20px;color:var(--tx)}.bal .op{font-size:20px;color:var(--mut);padding-bottom:16px}
.tr{display:grid;grid-template-columns:28px 150px 96px minmax(120px,1fr) minmax(130px,1fr) minmax(80px,1fr) var(--rw,100px) var(--rw,100px) 28px;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);min-width:900px}
.tr.h{background:var(--bg);font-size:11px;letter-spacing:.06em;color:var(--mut);position:sticky;top:0}
.tr.ed{background:var(--sel)}.tr span.r{text-align:right;padding-right:8px}
.tr input,.tr select{width:100%;font:inherit;padding:6px;border:1px solid var(--acc);border-radius:6px;background:var(--card);color:var(--tx)}
.ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);display:inline-block;cursor:pointer}.ck.on{background:var(--g);border-color:var(--g)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50;padding:16px}
.mod{background:var(--card);border-radius:12px;padding:18px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90%;overflow:auto}
.mod h4{margin:0 0 12px;font-size:17px}.mod input{width:100%;padding:10px;border:2px solid var(--acc);border-radius:8px;font:inherit;background:var(--card);color:var(--tx);margin-bottom:10px}
.mb{display:flex;gap:10px;align-items:center;margin-top:8px}.mb .sp{flex:1}.mb .lk{color:var(--acc);font-weight:600;padding:8px}.mb .del{color:var(--r);font-weight:600;padding:8px}
.atbl{width:100%;border-collapse:collapse;font-size:13px}.atbl td,.atbl th{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
.hb{display:none;color:#fff}
.lnk{color:var(--acc);font-weight:600}
@media(max-width:860px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(12px + env(safe-area-inset-top,0px))}aside.open{transform:none}
 .hb{display:inline-block;color:var(--acc);font-size:22px}
 .ins{position:fixed;inset:auto 0 0 0;width:auto;max-height:65%;border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.3);display:none;z-index:15}.ins.open{display:block}
 .rta{margin-left:0}.row{grid-template-columns:minmax(120px,1fr) 84px 84px 96px;padding:0 10px}.top{padding:10px 12px}
}
.x{display:none}@media(max-width:860px){.x{display:inline-block;margin-left:auto;color:var(--acc);font-weight:700}}

  const f=l.split(/\t|;|\s{2,}/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^\d{1,2}\.\d{1,2}\.(\d{2}|\d{4})$/.test(x)&&!/^[+\-−–]?\s?[\d.]+,\d{2}\s?€?$/.test(x)&&!/^[A-Z]{2}\d{2}[A-Z0-9 ]{10,}$/.test(x));
  let payee=f[0]||l.replace(dre,'').replace(a[0],'').replace(/€/g,'').trim(),memo=f.slice(1).join(' ');if(!payee)payee='Unknown';
  const sg=sugg(payee).filter(o=>o.why!=='freq')[0],dup=S.tx.some(t=>t.date===date&&Math.abs((t.in-t.out)-(inflow?v:-v))<.005&&t.payee.toLowerCase()===payee.toLowerCase());

function parseVoice(t){const l=t.toLowerCase();let v=0,m;

function rvQueue(){const sk=(UI.rv&&UI.rv.skipped)||[];return S.tx.filter(t=>needsCat(t)&&!sk.includes(t.id))}
function rvHTML(){const R=UI.rv,Q2=rvQueue(),t=Q2[0],n=Q2.length;
 const head=`<div class="rvh"><button class="rvb" data-a="rvx">‹</button><b>${n} ${gT('offen','to go')}</b><button class="rvu${R.stack.length?'':' off'}" data-a="rvundo">${gT('Rückgängig','Undo')}</button><button class="rvb" data-a="rvlist">≡</button></div>`;
 if(!t)return`<div class="rv">${head}<div class="rvst" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center"><div style="font-size:64px">🎉</div><div style="font-size:26px;font-weight:700">${gT('Alles kategorisiert','All categorized')}</div>${R.skipped.length?`<button class="rvk" style="padding:16px 28px;border-radius:30px;font-size:18px;font-weight:600" data-a="rvagain">${gT('Übersprungene ansehen','Review skipped')} (${R.skipped.length})</button>`:''}</div><div class="rvbtns"><button class="rvk" data-a="rvx">${gT('Fertig','Done')}</button></div></div>`;
 const sg=sugg(t.payee).filter(o=>o.why!=='freq').slice(0,2).map(o=>findCat(o.id)).filter(Boolean),ac=S.accounts.find(a=>a.id===t.acc)||{};
 const chips=(sg.length?sg.map(c=>`<button class="rvch" data-a="rvcat" data-t="${t.id}" data-c="${c.id}">${c.emoji} ${esc(c.name)}</button>`).join(''):`<button class="rvch need" data-a="rvpick" data-t="${t.id}">▣ ${gT('Kategorie nötig','Category Needed')}</button>`)+`<button class="rvch" data-a="rvpick" data-t="${t.id}">🔍 ${gT('Andere','Other')}</button>`;
 const nxt=Q2[1];
 return`<div class="rv">${head}<div class="rvst">${nxt?`<div class="rvc back"><div class="rvtop"><span class="rvacc"><i>💵</i>${esc(xAccN(nxt.acc))}</span></div></div>`:''}<div class="rvc" id="rvc" data-t="${t.id}"><div class="rvtop"><span class="rvacc"><i>💵</i>${esc(ac.name||'')}</span><button class="rved" data-a="rvedit" data-t="${t.id}">✎ ${gT('Bearbeiten','Edit')}</button></div><div class="rvmid"><div class="d">📅 ${dLong(t.date)}</div><div class="a">${F(t.out)}</div><div class="p">${esc(t.payee==='Unknown'?gT('Unbekannt','Unknown'):t.payee)}</div></div><div class="rvbot">${chips}</div><div class="rvo r" id="rvor"><i>🗂️</i>${gT('Kategorisieren','Categorize')}</div><div class="rvo l" id="rvol"><i>✕</i>${gT('Später','Skip for Now')}</div></div></div><div class="rvbtns"><button class="rvs" data-a="rvskipb">${gT('Später','Skip for Now')}</button><button class="rvk" data-a="rvcatb">${gT('Kategorisieren','Categorize')}</button></div></div>`}
function rvDo(kind,id,cat){const R=UI.rv;if(!R)return;if(kind==='skip'){R.skipped.push(id);R.stack.push({k:'skip',id});return render()}R.stack.push({k:'cat',id});commit(()=>{const t=S.tx.find(x=>x.id===id);if(t)t.cat=cat})}
function rvUndo(){const R=UI.rv,a=R&&R.stack.pop();if(!a)return render();if(a.k==='skip'){R.skipped=R.skipped.filter(x=>x!==a.id);render()}else undo()}
function rvFly(dir,fn){const c=document.getElementById('rvc');if(!c)return;const id=c.dataset.t;c.style.transition='transform .22s ease-out';c.style.transform=`translateX(${dir*130}%) rotate(${dir*14}deg)`;const o=document.getElementById(dir>0?'rvor':'rvol');if(o)o.style.opacity=1;setTimeout(()=>{if(fn)return fn();dir>0?rvCategorize(id):rvDo('skip',id)},210)}
function rvCategorize(id){const t=S.tx.find(x=>x.id===id),g=sugg(t.payee).filter(o=>o.why!=='freq')[0];if(g)rvDo('cat',id,g.id);else{UI.pk='cat';UI.pkTarget=id;UI.pq='';render()}}
let rvDrag=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('#rvc');if(!c||e.target.closest('button'))return;rvDrag={x:e.clientX,c};try{c.setPointerCapture(e.pointerId)}catch(x){}c.style.transition='none'});
document.addEventListener('pointermove',e=>{if(!rvDrag)return;const dx=e.clientX-rvDrag.x,c=rvDrag.c,o=Math.min(1,Math.abs(dx)/140),r=document.getElementById('rvor'),l=document.getElementById('rvol');c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;if(r)r.style.opacity=dx>0?o:0;if(l)l.style.opacity=dx<0?o:0});
const rvEnd=e=>{if(!rvDrag)return;const dx=e.clientX-rvDrag.x,c=rvDrag.c;rvDrag=null;if(Math.abs(dx)>110)rvFly(dx>0?1:-1);else{c.style.transition='transform .2s';c.style.transform='';['rvor','rvol'].forEach(i=>{const o=document.getElementById(i);if(o)o.style.opacity=0})}};
document.addEventListener('pointerup',rvEnd);document.addEventListener('pointercancel',rvEnd);
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&(t.classList.contains('txl')||t.classList.contains('phs')))document.body.classList.toggle('scr',t.scrollTop>50)},true);
document.addEventListener('contextmenu',e=>{const b=e.target.closest&&e.target.closest('aside .acc[data-i]');if(b){e.preventDefault();UI.modal={t:'accedit',id:b.dataset.i};render()}});

const ibSug=t=>{const o=sugg(t.payee).find(o=>o.why!=='freq');return o?o.id:''};
function inboxHTML(){const L=S.tx.filter(needsCat).sort((a,b)=>b.date.localeCompare(a.date)),an=i=>S.accounts.find(a=>a.id===i)?.name||'',ns=L.filter(ibSug).length;
 const rows=L.map(t=>{const s=ibSug(t);return`<div class="ibr"><span>${dd(t.date)}</span><span class="ibm">${esc(an(t.acc))}</span><span class="ibp"><b>${esc(t.payee)}</b>${t.memo?`<small>${esc(t.memo)}</small>`:''}</span><span class="r">${F(t.in-t.out)}</span><select data-ib="${t.id}" class="${s?'sug':''}"><option value="">${gT('Kategorie wählen…','Choose category…')}</option>${catOpts(s)}</select><button class="ibok" data-a="ibok" data-t="${t.id}" title="${gT('Übernehmen','Apply')}">✓</button></div>`}).join('');
 return`<div class="top"><button class="hb" data-a="side">☰</button><div class="hd" style="padding:0">📥 ${gT('Unkategorisiert','Uncategorized')}</div></div>
 <div class="bar"><span style="color:var(--mut);font-weight:400">${L.length?gT(L.length+' Ausgaben ohne Kategorie',L.length+' outflows without a category')+(ns?gT(' · '+ns+' mit Vorschlag',' · '+ns+' with suggestion'):''):''}</span><span class="sp"></span>${ns?`<button data-a="iball">✓ ${gT('Alle Vorschläge übernehmen','Apply all suggestions')}</button>`:''}</div>
 <div class="ib">${L.length?`<div class="ibr h"><span>${gT('Datum','Date')}</span><span>${gT('Konto','Account')}</span><span>${gT('Empfänger','Payee')}</span><span class="r">${gT('Betrag','Amount')}</span><span>${gT('Kategorie','Category')}</span><span></span></div>${rows}`:`<div class="ibe"><div style="font-size:48px">🎉</div><b>${gT('Alles kategorisiert','All categorized')}</b><span class="sl">${gT('Neue Ausgaben ohne Kategorie landen automatisch hier.','New outflows without a category land here automatically.')}</span></div>`}</div>`}
function ibSet(m){if(!Object.keys(m).length)return;commit(()=>{S.tx.forEach(t=>{if(m[t.id]&&needsCat(t))t.cat=m[t.id]})})}

// ===== Automatische Backups (IndexedDB, nur auf diesem Gerät) =====
const BK_AUTO=14,BK_OTHER=10,dayNow=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function bkDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('base-backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function bkStore(mode,fn){return bkDB().then(db=>new Promise((ok,no)=>{const tx=db.transaction('snaps',mode),r=fn(tx.objectStore('snaps'));tx.oncomplete=()=>{db.close();ok(r&&r.result)};tx.onerror=()=>{db.close();no(tx.error)}}))}
const bkList=()=>bkStore('readonly',st=>st.getAll()).then(L=>(L||[]).sort((a,b)=>b.id-a.id));
async function bkSave(why){try{const data=snap(),L=await bkList();
 if(!(L[0]&&L[0].data===data))await bkStore('readwrite',st=>{st.put({id:Date.now(),why,n:S.tx.length,data})});
 const all=await bkList(),old=[...all.filter(x=>x.why==='auto').slice(BK_AUTO),...all.filter(x=>x.why!=='auto').slice(BK_OTHER)];
 if(old.length)await bkStore('readwrite',st=>{old.forEach(x=>st.delete(x.id))});return true}catch(e){return false}}
function bkTick(){if(lsGet('bk-day')!==dayNow()){lsSet('bk-day',dayNow());bkSave('auto')}}
function bkOpen(){UI.modal={t:'bk'};UI.bkl=null;UI.bkc=null;render();bkList().then(L=>{UI.bkl=L},()=>{UI.bkl=[]}).then(()=>{if(UI.modal&&UI.modal.t==='bk')render()})}
