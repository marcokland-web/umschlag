 tx:[{id:uid(),acc:a.id,date:TODAY,payee:'Starting Balance',cat:null,memo:'',out:0,in:8000,cl:true}],assigned:{}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}

const cats=()=>S.groups.flatMap(g=>g.cats.filter(c=>!c.hidden));
const allCats=()=>S.groups.flatMap(g=>g.cats);
const findCat=id=>allCats().find(c=>c.id===id);
const asg=(c,m)=>S.assigned[c+'|'+m]||0;
const act=(c,m)=>S.tx.filter(t=>t.cat===c&&mk(t.date)===m).reduce((s,t)=>s+t.in-t.out,0);

const rtaOf=m=>{let s=S.tx.filter(t=>!t.cat&&!t.xf&&mk(t.date)<=m).reduce((a,t)=>a+t.in-t.out,0);for(const k in S.assigned)if(k.split('|')[1]<=m)s-=S.assigned[k];
 const p=shift(m,-1);if(firstM()<=p)allCats().forEach(c=>{let k=firstM(),v=0;for(;k<=p;k=shift(k,1)){v=Math.max(0,v)+asg(c.id,k)+act(c.id,k);if(v<0)s+=v}});return Math.round(s*100)/100};
const funded=(c,m)=>asg(c.id,m)+((c.tt==='refill'||c.tt==='by')?Math.max(0,avail(c.id,shift(m,-1))):0);
const dueNext=(c,m)=>{const d=c.due;if(!d)return null;if(d.ym)return d.ym>=m?d.ym:null;for(let i=0;i<13;i++){const k=shift(m,i);if((d.mo||[]).includes(+k.slice(4)))return k}return null};
const mDiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(4)-+a.slice(4));

const under=(c,m)=>{if(!c.target||(c.snooze||[]).includes(m))return 0;
 if(c.tt==='by'&&c.due){const dm=dueNext(c,m);if(!dm)return 0;const need=Math.max(0,c.target-Math.max(0,avail(c.id,shift(m,-1)))),mon=Math.ceil(need/(mDiff(m,dm)+1)*100)/100;return Math.max(0,Math.round((mon-asg(c.id,m))*100)/100)}
 return Math.max(0,Math.round((c.target-funded(c,m))*100)/100)};

function planHTML(){const m=UI.month,r=rtaOf(m),cs=cats(),over=cs.filter(c=>avail(c.id,m)<0).length;

function homeHTML(){const m=mk(TODAY),r=rtaOf(m),cs=cats(),over=cs.filter(c=>avail(c.id,m)<0),inc=S.tx.filter(t=>!t.cat&&!t.xf&&mk(t.date)===m&&t.payee!=='Starting Balance').reduce((a,t)=>a+t.in-t.out,0),exp=-cs.reduce((a,c)=>a+act(c.id,m),0),
 sv=inc>0?Math.round((inc-exp)/inc*100):null,und=cs.map(c=>[c,under(c,m)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),ex=recStatus(m).slice(0,6),dl=Math.max(1,new Date(+m.slice(0,4),+m.slice(4),0).getDate()-(+TODAY.slice(8))+1),vr=cs.filter(c=>c.tt==='refill').reduce((a,c)=>a+Math.max(0,avail(c.id,m)),0);

 return`<div class="top"><button class="hb" data-a="side">☰</button><div class="hd" style="padding:0">${gT('Start','Home')} · ${ml(m)}</div></div><div class="hgrid"><div class="rta ${r<0?'n':r===0?'z':''}" style="grid-column:1/-1"><div><b>${F(r)}</b>${gT('Zuweisbar','Ready to Assign')}</div></div>
 ${over.length?`<div class="box"><div class="sum">⚠ ${over.length} ${gT('überzogen','overspent')}</div>${over.slice(0,5).map(c=>kv(c.emoji+' '+esc(c.name),F(avail(c.id,m)))).join('')}<button class="btn l" data-a="cover" style="margin-top:6px">${gT('Decken','Cover')}</button></div>`:''}
 <div class="box"><div class="sum">${gT('Dieser Monat','This month')}</div>${kv(gT('Einnahmen','Income'),F(inc))}${kv(gT('Ausgaben','Spending'),F(exp))}${kv(gT('Saldo','Net'),F(inc-exp),1)}${sv!==null?kv(gT('Sparquote','Savings rate'),sv+' %'):''}</div>
 <div class="box"><div class="sum">${gT('Ziele','Targets')}${und.length?' · '+F(und.reduce((a,x)=>a+x[1],0)):''}</div>${und.length?und.slice(0,6).map(([c,u])=>kv(c.emoji+' '+esc(c.name),F(u))).join(''):`<div class="sl">✓ ${gT('Alle Ziele für diesen Monat sind finanziert.','All targets for this month are funded.')}</div>`}</div>
 <div class="box"><div class="sum">${gT('Variables Budget','Variable budget')}</div>${kv(gT('Noch verfügbar','Left'),F(vr))}${kv(gT('Pro Resttag','Per remaining day'),F(vr/dl),1)}</div>
 <div class="box"><div class="sum">${gT('Erwartet','Expected')}</div>${ex.length?ex.map(x=>kv(dd(x.date).slice(0,5)+' '+esc(x.r.lb||x.r.name),(x.r.dir==='in'?'+':'−')+F(x.r.amt))).join(''):`<div class="sl">${gT('Nichts mehr offen.','Nothing left.')}</div>`}</div>
 <div class="box"><div class="sum">${gT('Konten','Accounts')}</div>${S.accounts.map(a=>kv(esc(a.name),F(accBal(a.id)))).join('')}<button class="btn l" data-a="check" style="margin-top:6px">✅ ${gT('Plan prüfen','Check plan')}</button></div></div>`}
// Plan pruefen
function planCheck(){const out=[],ok=t=>out.push({s:'ok',t}),warn=(t,fix)=>out.push({s:'warn',t,fix}),bad=(t,fix)=>out.push({s:'bad',t,fix});
 const ids=new Set(allCats().map(c=>c.id)),m1=shift(mk(TODAY),1);let b0=null;
 for(let k=firstM();k<=m1;k=shift(k,1)){const bal=S.tx.filter(t=>mk(t.date)<=k).reduce((a,t)=>a+t.in-t.out,0),sm=allCats().reduce((a,c)=>a+avail(c.id,k),0),df=Math.round((rtaOf(k)+sm-bal)*100)/100;if(Math.abs(df)>.01){b0={k,df};break}}
 const oa=Object.keys(S.assigned).filter(k=>!ids.has(k.split('|')[0])&&S.assigned[k]),ot=S.tx.filter(t=>t.cat&&!ids.has(t.cat)),ox=S.tx.filter(t=>t.xf&&!S.tx.some(p=>p.id===t.xf));
 b0?bad(gT('Kontostände ≠ Zuweisbar + Kategorien ('+ml(b0.k)+', Differenz '+F(b0.df)+')','Balances ≠ RTA + categories ('+ml(b0.k)+', diff '+F(b0.df)+')'),1):ok(gT('Kontostände = Zuweisbar + Kategorien (alle Monate)','Balances = RTA + categories (all months)'));
 oa.length?bad(oa.length+gT(' Zuweisungen zu gelöschten Kategorien',' assignments to deleted categories'),1):ok(gT('Keine verwaisten Zuweisungen','No orphaned assignments'));
 ot.length?bad(ot.length+gT(' Buchungen mit gelöschter Kategorie',' transactions with deleted category'),1):ok(gT('Alle Buchungen haben gültige Kategorien','All transactions have valid categories'));
 ox.length?bad(ox.length+gT(' unvollständige Überweisungen',' unpaired transfers'),1):ok(gT('Überweisungen sind vollständig','Transfers are complete'));
 const dup={};S.tx.forEach(t=>{const k=[t.acc,t.date,t.payee,t.in,t.out].join('|');dup[k]=(dup[k]||0)+1});const nd=Object.values(dup).filter(n=>n>1).length;
 nd?warn(nd+gT(' mögliche Doppelbuchungen',' possible duplicates')):ok(gT('Keine Doppelbuchungen','No duplicates'));
 const un=S.tx.filter(t=>!t.cat&&!t.xf&&t.out>0&&t.payee!=='Starting Balance');un.length?warn(un.length+gT(' Ausgaben ohne Kategorie (mindern „Zuweisbar“)',' expenses without category'),0):ok(gT('Alle Ausgaben haben eine Kategorie','All expenses categorized'));
 const fu=S.tx.filter(t=>t.date>TODAY).length;fu?warn(fu+gT(' Buchungen in der Zukunft',' future-dated transactions')):0;
 const m=mk(TODAY),r=rtaOf(m),ov=cats().filter(c=>avail(c.id,m)<0).length;r<0?warn(gT('„Zuweisbar“ ist negativ: ','RTA negative: ')+F(r)):ok(gT('„Zuweisbar“ ist nicht negativ','RTA is not negative'));ov?warn(ov+gT(' überzogene Kategorien',' overspent categories')):ok(gT('Keine überzogenen Kategorien','No overspent categories'));
 return out}
function checkFix(){const ids=new Set(allCats().map(c=>c.id));Object.keys(S.assigned).forEach(k=>{if(!ids.has(k.split('|')[0]))delete S.assigned[k]});S.tx.forEach(t=>{if(t.cat&&!ids.has(t.cat))t.cat=null;if(t.xf&&!S.tx.some(p=>p.id===t.xf))delete t.xf})}
function checkHTML(){const L=planCheck();return`<h4>✅ ${gT('Plan prüfen','Plan check')}</h4>${L.map(x=>`<div style="padding:3px 0;font-size:13px">${x.s==='ok'?'✓':x.s==='warn'?'⚠':'✕'} ${esc(x.t)}</div>`).join('')}<div class="mb">${L.some(x=>x.fix)?`<button class="btn" data-a="chkfix">${gT('Reparieren','Fix')}</button>`:''}<span class="sp"></span><button class="lk" data-a="mx">${gT('Schließen','Close')}</button></div>`}
// Umsortieren
function moveCat(id,dir){commit(()=>{const gi=S.groups.findIndex(g=>g.cats.some(c=>c.id===id)),g=S.groups[gi],ci=g.cats.findIndex(c=>c.id===id),c=g.cats[ci];
 if(dir<0){if(ci>0){g.cats.splice(ci,1);g.cats.splice(ci-1,0,c)}else if(gi>0){g.cats.splice(ci,1);S.groups[gi-1].cats.push(c)}}
 else{if(ci<g.cats.length-1){g.cats.splice(ci,1);g.cats.splice(ci+1,0,c)}else if(gi<S.groups.length-1){g.cats.splice(ci,1);S.groups[gi+1].cats.unshift(c)}}})}
function moveGrp(id,dir){commit(()=>{const i=S.groups.findIndex(g=>g.id===id),j=i+dir;if(j<0||j>=S.groups.length)return;const[x]=S.groups.splice(i,1);S.groups.splice(j,0,x)})}
function dropMove(k1,i1,k2,i2){if(k1===k2&&i1===i2)return;commit(()=>{
 if(k1==='c'){let c;for(const g of S.groups){const x=g.cats.findIndex(y=>y.id===i1);if(x>=0){[c]=g.cats.splice(x,1);break}}if(!c)return;
  if(k2==='g')S.groups.find(g=>g.id===i2).cats.push(c);else{const g=S.groups.find(g=>g.cats.some(y=>y.id===i2));g.cats.splice(g.cats.findIndex(y=>y.id===i2),0,c)}}
 else{const i=S.groups.findIndex(g=>g.id===i1),[x]=S.groups.splice(i,1),j=k2==='g'?S.groups.findIndex(g=>g.id===i2):S.groups.findIndex(g=>g.cats.some(y=>y.id===i2));S.groups.splice(j,0,x)}})}
let DR=null;

document.addEventListener('dragover',e=>{if(DR&&e.target.closest&&e.target.closest('[data-dr]'))e.preventDefault()});
