<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marco's Plan | YNAB</title>
<style>
:root{--bg:#f5f5f8;--card:#fff;--tx:#1d1d2b;--mut:#6b6b80;--line:#e3e3ec;--acc:#2a2ac2;--side:#1c1c8f;--sideh:#3232d0;--rta:#a8d84a;--g:#2d7a1e;--pill:#e8e8ee;--y:#f5c518;--r:#e5473c;--gp:#bfe6a8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15151f;--card:#1e1e2b;--tx:#ececf5;--mut:#9a9ab0;--line:#30303f;--pill:#2c2c3b;--acc:#8b8bff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{display:flex;height:100%}
aside{width:240px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:12px;flex:none;z-index:20;transition:transform .2s}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;width:100%;text-align:left;font-weight:600;color:#fff;font-size:15px}
.nav.on{background:var(--sideh)}.nav:hover{background:rgba(255,255,255,.1)}
.plan{padding:6px 8px 14px}.plan b{font-size:16px;display:block}.plan small{opacity:.75}
.sec{display:flex;justify-content:space-between;padding:14px 12px 4px;font-weight:700;font-size:12px;letter-spacing:.04em;opacity:.9}
.acc{display:flex;justify-content:space-between;padding:6px 12px 6px 20px;width:100%;border-radius:8px;font-weight:600}
.acc.on{background:var(--sideh)}
.sbtn{background:rgba(255,255,255,.14);border-radius:8px;padding:9px;margin-top:8px;width:100%;font-weight:600;color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
.mnav{display:flex;align-items:center;gap:10px}
.circ{width:32px;height:32px;border:2px solid var(--acc);border-radius:50%;color:var(--acc);display:grid;place-items:center;font-weight:700}
.mo{font-size:20px;font-weight:700}
.rta{margin-left:16px;display:flex;align-items:center;gap:16px;padding:8px 14px;border-radius:10px;position:relative;background:var(--rta);color:#1d2b0c}
.rta.z{background:var(--pill);color:var(--tx)}.rta.n{background:var(--r);color:#fff}
.rta b{font-size:20px;display:block}.rta .ab{background:var(--g);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700}
.pop{position:absolute;top:100%;left:0;margin-top:8px;width:330px;background:var(--card);color:var(--tx);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:30;overflow:hidden}
.tabs{display:flex}.tabs button{flex:1;padding:12px;font-weight:600;color:var(--mut)}.tabs .on{color:var(--acc);border-bottom:2px solid var(--acc)}
.ai{display:flex;justify-content:space-between;padding:9px 14px;margin:4px 8px;border-radius:8px;background:var(--bg);color:var(--acc);width:calc(100% - 16px);font-weight:500}
.ai:hover{background:var(--pill)}
.chips{display:flex;gap:6px;padding:12px 20px 4px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:var(--pill);font-size:13px}.chip.on{background:#d9d9f7;color:var(--acc);outline:1px solid var(--acc)}.chip.red{background:var(--r);color:#fff}
.bar{display:flex;gap:16px;padding:10px 20px;color:var(--acc);font-weight:600;align-items:center;flex-wrap:wrap}
.bar button:disabled{opacity:.4;cursor:default}.bar .sp{flex:1}
.body{flex:1;display:flex;min-height:0}
.tbl{flex:1;overflow:auto;min-width:0}
.row{display:grid;grid-template-columns:minmax(160px,1fr) 110px 110px 120px;align-items:center;padding:0 16px;min-height:44px;border-bottom:1px solid var(--line);background:var(--card);cursor:default}
.row.h{position:sticky;top:0;z-index:2;font-size:11px;letter-spacing:.06em;color:var(--mut);background:var(--bg);min-height:34px}
.row.g{background:var(--bg);font-weight:700}
.row.sel{background:#dcdcfa;outline:none}
.row>span:nth-child(n+2){text-align:right}
.nm{display:flex;align-items:center;gap:8px;min-width:0}.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{opacity:0;color:var(--acc);font-weight:700;font-size:18px}.row:hover .pl{opacity:1}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;background:var(--pill);min-width:74px;text-align:center}
.pill.g{background:var(--gp);color:#1d4a10}.pill.y{background:var(--y);color:#3b2f00;font-weight:600}.pill.r{background:var(--r);color:#fff;font-weight:600}
.ainp{width:96px;text-align:right;font:inherit;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;background:var(--card);color:var(--tx)}
.ins{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px}
.ins h3{margin:0 0 12px;font-size:18px;display:flex;gap:8px;align-items:center}
.box{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}.kv.b{color:var(--tx);font-weight:600}
.ring{width:64px;height:64px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-weight:700;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--pill) 0)}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal}
.ybox{background:#fbeeb3;color:#3b2f00;border-radius:10px;padding:12px;text-align:center;margin:8px 0}
.btn{background:var(--acc);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600}.btn.y{background:var(--y);color:#3b2f00;width:100%;margin-top:6px}.btn.l{background:var(--pill);color:var(--acc);width:100%}
.sum{font-weight:700;margin:0 0 6px}
.reg{flex:1;overflow:auto}
.hd{padding:16px 20px 4px;font-size:26px;font-weight:700}
.bal{display:flex;gap:14px;padding:8px 20px 12px;align-items:flex-end;flex-wrap:wrap}.bal div{color:var(--mut);font-size:12px}.bal b{display:block;font-size:20px;color:var(--tx)}.bal .op{font-size:20px;color:var(--mut);padding-bottom:16px}
.tr{display:grid;grid-template-columns:28px 150px 96px minmax(120px,1fr) minmax(130px,1fr) minmax(80px,1fr) 100px 100px 28px;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);min-width:900px}
.tr.h{background:var(--bg);font-size:11px;letter-spacing:.06em;color:var(--mut);position:sticky;top:0}
.tr.ed{background:#dcdcfa}.tr span.r{text-align:right}
.tr input,.tr select{width:100%;font:inherit;padding:6px;border:1px solid var(--acc);border-radius:6px;background:var(--card);color:var(--tx)}
.ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);display:inline-block;cursor:pointer}.ck.on{background:var(--g);border-color:var(--g)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50;padding:16px}
.mod{background:var(--card);border-radius:12px;padding:18px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90%;overflow:auto}
.mod h4{margin:0 0 12px;font-size:17px}.mod input{width:100%;padding:10px;border:2px solid var(--acc);border-radius:8px;font:inherit;background:var(--card);color:var(--tx);margin-bottom:10px}
.mb{display:flex;gap:10px;align-items:center;margin-top:8px}.mb .sp{flex:1}.mb .lk{color:var(--acc);font-weight:600;padding:8px}.mb .del{color:var(--r);font-weight:600;padding:8px}
.atbl{width:100%;border-collapse:collapse;font-size:13px}.atbl td,.atbl th{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
.hb{display:none;color:#fff}
.lnk{color:var(--acc);font-weight:600}
@media(max-width:860px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(12px + env(safe-area-inset-top,0px))}aside.open{transform:none}
 .hb{display:inline-block;color:var(--acc);font-size:22px}
 .ins{position:fixed;inset:auto 0 0 0;width:auto;max-height:65%;border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.3);display:none;z-index:15}.ins.open{display:block}
 .rta{margin-left:0}.row{grid-template-columns:minmax(120px,1fr) 84px 84px 96px;padding:0 10px}.top{padding:10px 12px}
}
.x{display:none}@media(max-width:860px){.x{display:inline-block;margin-left:auto;color:var(--acc);font-weight:700}}
</style></head><body>
<div id="app"></div>
<script>
const K='ynab-nachbau-v1',EM=['🏠','📱','⚡','🛒','🚗','🩺','🚨','🍽️','🎁','🏝️','❗','🌳'];
const uid=()=>Math.random().toString(36).slice(2,9);
const F=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n).replace(/\s/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MNE=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MND=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];let LANG='de';try{LANG=localStorage.getItem('ynab-lang')||'de'}catch(e){}let MN=LANG==='de'?MND:MNE;
const mk=d=>d.slice(0,4)+d.slice(5,7);
const shift=(m,d)=>{const t=new Date(+m.slice(0,4),+m.slice(4)-1+d,1);return t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')};
const ml=m=>MN[+m.slice(4)-1]+' '+m.slice(0,4);
const dd=d=>d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const num=s=>{s=String(s).replace(/[€\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isNaN(v)?0:Math.round(v*100)/100};
const TODAY='2026-09-29';
function seed(){const c=(n,e)=>({id:uid(),name:n,emoji:e,target:0,hidden:false});
 const a={id:uid(),name:'TradeRepubic'};
 return{accounts:[a],groups:[
 {id:uid(),name:'Bills',cats:[c('Rent/Mortgage','🏠'),c('Phone & Internet','📱'),c('Utilities','⚡')]},
 {id:uid(),name:'Needs',cats:[c('Groceries','🛒'),c('Transportation','🚗'),c('Medical expenses','🩺'),c('Emergency fund','🚨')]},
 {id:uid(),name:'Wants',cats:[c('Dining out','🍽️'),c('Entertainment','🎁'),c('Vacation','🏝️'),c('Stuff I forgot to plan for','❗'),c('YNAB subscription','🌳')]}],
 tx:[{id:uid(),acc:a.id,date:TODAY,payee:'Starting Balance',cat:null,memo:'',out:0,in:8000,cl:true}],assigned:{}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.groups)S=seed();
const UI={view:'plan',month:mk(TODAY),sel:null,filter:'all',pop:false,tab:'auto',modal:null,acc:'all',rt:'spend',rp:3,rg:'group',txedit:null,adding:false,checked:{},edit:null,side:false,ins:false};
let hist=[],redo=[];
const snap=()=>JSON.stringify(S);
function commit(fn){hist.push(snap());if(hist.length>80)hist.shift();redo=[];fn();save();render()}
function save(){S.mod=Date.now();try{localStorage.setItem(K,snap())}catch(e){}gPush()}
function undo(){if(!hist.length)return;redo.push(snap());S=JSON.parse(hist.pop());save();render()}
function redoF(){if(!redo.length)return;hist.push(snap());S=JSON.parse(redo.pop());save();render()}
const cats=()=>S.groups.flatMap(g=>g.cats.filter(c=>!c.hidden));
const allCats=()=>S.groups.flatMap(g=>g.cats);
const findCat=id=>allCats().find(c=>c.id===id);
const asg=(c,m)=>S.assigned[c+'|'+m]||0;
const act=(c,m)=>S.tx.filter(t=>t.cat===c&&mk(t.date)===m).reduce((s,t)=>s+t.in-t.out,0);
const firstM=()=>{const a=[mk(TODAY)];S.tx.forEach(t=>a.push(mk(t.date)));for(const k in S.assigned)a.push(k.split('|')[1]);return a.sort()[0]};
const avail=(c,m)=>{let k=firstM();if(m<k)k=m;let v=0;for(;;){v=Math.max(0,v)+asg(c,k)+act(c,k);if(k>=m)break;k=shift(k,1)}return Math.round(v*100)/100};
const rtaOf=m=>{let s=S.tx.filter(t=>!t.cat&&mk(t.date)<=m).reduce((a,t)=>a+t.in-t.out,0);for(const k in S.assigned)if(k.split('|')[1]<=m)s-=S.assigned[k];
 const p=shift(m,-1);if(firstM()<=p)allCats().forEach(c=>{let k=firstM(),v=0;for(;k<=p;k=shift(k,1)){v=Math.max(0,v)+asg(c.id,k)+act(c.id,k);if(v<0)s+=v}});return Math.round(s*100)/100};
const under=(c,m)=>c.target&&!(c.snooze||[]).includes(m)?Math.max(0,Math.round((c.target-asg(c.id,m))*100)/100):0;
const accBal=id=>S.tx.filter(t=>t.acc===id).reduce((s,t)=>s+t.in-t.out,0);
function autoItems(m){const p=shift(m,-1),cs=cats(),sum=f=>Math.round(cs.reduce((s,c)=>s+f(c),0)*100)/100;
 const avg=f=>{let t=0;for(let i=1;i<=3;i++)t+=f(shift(m,-i));return Math.round(t/3*100)/100};
 return[['under','Underfunded',c=>asg(c.id,m)+under(c,m)],
 ['la','Assigned Last Month',c=>asg(c.id,p)],
 ['sl','Spent Last Month',c=>Math.max(0,-act(c.id,p))],
 ['aa','Average Assigned',c=>avg(x=>asg(c.id,x))],
 ['as','Average Spent',c=>avg(x=>Math.max(0,-act(c.id,x)))],
 ['ra','Reset Available Amounts',c=>asg(c.id,m)-Math.max(0,avail(c.id,m))],
 ['rs','Reset Assigned Amounts',c=>0]].map(([k,l,f])=>({k,l,f,amt:k==='under'?sum(c=>under(c,m)):k==='ra'?sum(c=>Math.max(0,avail(c.id,m))):k==='rs'?sum(c=>asg(c.id,m)):sum(f)}))}
function applyAuto(k){const it=autoItems(UI.month).find(i=>i.k===k);commit(()=>{cats().forEach(c=>{S.assigned[c.id+'|'+UI.month]=Math.round(it.f(c)*100)/100});UI.pop=false})}
function pillCls(c,m){const a=avail(c.id,m);if(a<0)return'r';if(under(c,m)>0)return'y';return a>0?'g':''}
function pass(c,m){const a=avail(c.id,m),f=UI.filter;return f==='all'||(f==='over'&&a<0)||(f==='under'&&under(c,m)>0)||(f==='overf'&&a>0&&c.target&&a>c.target)||(f==='money'&&a>0)||(f==='snz'&&c.target&&(c.snooze||[]).includes(m))}
function planHTML(){const m=UI.month,r=rtaOf(m),cs=cats(),over=cs.filter(c=>avail(c.id,m)<0).length;
 const rc=r<0?'n':r===0?'z':'';
 const ai=autoItems(m);
 const auto=ai.map(i=>`<button class="ai" data-a="auto" data-k="${i.k}"><span>${i.l}</span><span>${F(i.amt)}</span></button>`).join('');
 let rows='';
 for(const g of S.groups){const gc=g.cats.filter(c=>!c.hidden&&pass(c,m));if(UI.filter!=='all'&&!gc.length)continue;
  const A=gc.reduce((s,c)=>s+asg(c.id,m),0),B=gc.reduce((s,c)=>s+act(c.id,m),0),C=gc.reduce((s,c)=>s+avail(c.id,m),0);
  rows+=`<div class="row g"><span class="nm"><button data-a="tg" data-g="${g.id}">${g.collapsed?'▸':'▾'}</button><span data-a="egrp" data-g="${g.id}" style="cursor:pointer">${esc(g.name)}</span><button class="pl" data-a="newcat" data-g="${g.id}" title="Add Category">⊕</button></span><span>${F(A)}</span><span>${F(B)}</span><span>${F(C)}</span></div>`;
  if(!g.collapsed)for(const c of gc){const a=avail(c.id,m),ed=UI.edit===c.id;
   rows+=`<div class="row${UI.sel===c.id?' sel':''}" data-a="sel" data-c="${c.id}"><span class="nm">${c.emoji} <span data-a="ecat" data-c="${c.id}" style="cursor:pointer">${esc(c.name)}</span></span>
   <span>${ed?`<input class="ainp" id="ai" value="${String(asg(c.id,m)).replace('.',',')}" data-c="${c.id}">`:`<span data-a="ed" data-c="${c.id}" style="cursor:text">${F(asg(c.id,m))}</span>`}</span>
   <span><span data-a="actv" data-c="${c.id}" style="cursor:pointer">${F(act(c.id,m))}</span></span>
   <span><span class="pill ${pillCls(c,m)}">${under(c,m)>0&&a>=0?'◔ ':''}${F(a)}</span></span></div>`}}
 const tot=cs.reduce((s,c)=>s+asg(c.id,m),0);
 return`<div class="top"><button class="hb" data-a="side">☰</button><div class="mnav"><button class="circ" data-a="mo" data-d="-1">‹</button><div><div class="mo">${ml(m)} ▾</div></div><button class="circ" data-a="mo" data-d="1">›</button></div>
 <div class="rta ${rc}"><div><b>${F(r)}</b>${r===0?'All Money Assigned':r<0?'Assigned more than you have':'Ready to Assign'}</div><button class="ab" data-a="pop">Assign ▾</button>
 ${UI.pop?`<div class="pop"><div class="tabs"><button class="${UI.tab==='auto'?'on':''}" data-a="tab" data-t="auto">⚡ Auto</button><button class="${UI.tab==='man'?'on':''}" data-a="tab" data-t="man">Manually</button></div>
 ${UI.tab==='auto'?`<div style="padding:8px 0">${auto}</div>`:`<div style="padding:14px;color:var(--mut)">Click an amount in the Assigned column to type it in. Currently assigned: <b>${F(tot)}</b></div>`}</div>`:''}</div></div>
 <div class="chips">${[['all','All'],['over',over?`⚠ ${over} Overspent`:'Overspent'],['under','Underfunded'],['overf','Overfunded'],['money','Money Available'],['snz','Snoozed']].map(([k,l])=>`<button class="chip${UI.filter===k?' on':''}${k==='over'&&over?' red':''}" data-a="flt" data-f="${k}">${l}</button>`).join('')}</div>
 <div class="bar"><button data-a="newgrp">⊕ Category Group</button><button data-a="undo" ${hist.length?'':'disabled'}>↶ Undo</button><button data-a="redo" ${redo.length?'':'disabled'}>↷ Redo</button><button data-a="recent">◷ Recent Moves</button></div>
 <div class="body"><div class="tbl"><div class="row h"><span>CATEGORY</span><span>ASSIGNED</span><span>ACTIVITY</span><span>AVAILABLE</span></div>${rows}</div>
 <div class="ins${UI.ins?' open':''}">${insHTML(m,ai)}</div></div>`}
function insHTML(m,ai){const c=findCat(UI.sel);
 if(!c){const A=cats().reduce((s,x)=>s+asg(x.id,m),0),B=cats().reduce((s,x)=>s+act(x.id,m),0),L=cats().reduce((s,x)=>s+Math.max(0,avail(x.id,shift(m,-1))),0);
  return`<button class="x" data-a="cins">Close</button><div class="sum">${MN[+m.slice(4)-1]==='Sep'?'September':ml(m)}'s Summary ▾</div><div class="box"><div class="kv"><span>Left Over from Last Month</span><span>${F(L)}</span></div><div class="kv"><span>Assigned in ${MN[+m.slice(4)-1]}</span><span>${F(A)}</span></div><div class="kv"><span>Activity</span><span>${F(B)}</span></div><div class="kv b"><span>Available</span><span>${F(L+A+B)}</span></div></div>
  <div class="sum">⚡ Auto-Assign</div>${ai.map(i=>`<button class="ai" data-a="auto" data-k="${i.k}"><span>${i.l}</span><span>${F(i.amt)}</span></button>`).join('')}`}
 const a=avail(c.id,m),as=asg(c.id,m),ac=act(c.id,m),u=under(c,m),left=Math.max(0,avail(c.id,shift(m,-1)));
 return`<button class="x" data-a="cins">Close</button><h3>${c.emoji} ${esc(c.name)} <button data-a="ecat" data-c="${c.id}" style="margin-left:auto;color:var(--mut)">✎</button></h3>
 <div class="box"><div class="kv b"><span>Available Balance</span><span class="pill ${pillCls(c,m)}">${F(a)}</span></div><div class="kv"><span>Cash Left Over From Last Month</span><span>${F(left)}</span></div><div class="kv"><span>Assigned This Month</span><span>${F(as)}</span></div><div class="kv"><span>Cash Spending</span><span>${F(ac)}</span></div><div class="kv"><span>Credit Spending</span><span>${F(0)}</span></div></div>
 <div class="box"><div class="sum">◔ Target ▾</div>${c.target?`<div>Set Aside Another ${F(c.target)} Each Month<br><small style="color:var(--mut)">By the End of the Month</small></div>
 <div class="ring" style="--p:${Math.min(100,Math.round(as/c.target*100))}"><i>${Math.min(100,Math.round(as/c.target*100))}%</i></div>
 ${u>0?`<div class="ybox">Assign ${F(u)} to meet your target<button class="btn y" data-a="fill" data-c="${c.id}">Assign</button></div>`:'<div class="ybox" style="background:var(--gp)">Target met 🎉</div>'}
 <div class="kv"><span>Amount to Assign This Month</span><span>${F(c.target)}</span></div><div class="kv"><span>Assigned So Far</span><span>${F(as)}</span></div><div class="kv b"><span>To Go</span><span>${F(u)}</span></div>

function tr(c){if(D[c])return D[c];for(const[r,x]of P)if(r.test(c))return c.replace(r,x);return null}
function trDom(root){if(LANG!=='de')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())L.push(n);
 L.forEach(n=>{const m=n.nodeValue.match(/^(\s*[^A-Za-z]*)([\s\S]*?)(\s*)$/);if(!m||!m[2])return;const r=tr(m[2]);if(r)n.nodeValue=m[1]+r+m[3]});
 root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(k=>{const v=e.getAttribute(k);if(v){const r=tr(v);if(r)e.setAttribute(k,r)}}))}

const GD={cid:'764904792444-21vta8qu7edshvdqrsipo5mk185a8kim.apps.googleusercontent.com',sc:'https://www.googleapis.com/auth/drive.file',fn:'ynab-nachbau.json'};
const gT=(d,e)=>LANG==='de'?d:e;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
let gSt=lsGet('gd-on')?'paused':'off',gLast='',gTok=null,gExp=0,gTC=null,gCb=null,gAuthP=null,gBusy=false,gTm=null;
function gLabel(){return'☁ '+({off:gT('Mit Google Drive verbinden','Connect Google Drive'),paused:gT('Sync pausiert – tippen','Sync paused – tap'),sync:gT('Synchronisiere…','Syncing…'),ok:gT('Synchronisiert ','Synced ')+gLast,err:gT('Sync-Fehler – tippen','Sync error – tap'),unavail:gT('Sync nur auf eigener Seite','Sync only on own site')}[gSt])}
function gStatus(k){gSt=k;const b=document.getElementById('gdb');if(b)b.textContent=gLabel()}
function gAuth(){if(gTok&&Date.now()<gExp)return Promise.resolve(gTok);if(gAuthP)return gAuthP;
 gAuthP=new Promise((res,rej)=>{if(!window.google||!google.accounts)return rej(new Error('nogsi'));
  if(!gTC)gTC=google.accounts.oauth2.initTokenClient({client_id:GD.cid,scope:GD.sc,callback:r=>{if(r.error)return gCb.rej(r);gTok=r.access_token;gExp=Date.now()+(r.expires_in-90)*1000;gCb.res(gTok)},error_callback:e=>gCb.rej(e)});
  gCb={res,rej};gTC.requestAccessToken({prompt:''})}).finally(()=>{gAuthP=null});return gAuthP}
async function gApi(url,opt={},retry=1){const t=await gAuth();const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
 if(r.status===401&&retry){gTok=null;return gApi(url,opt,0)}if(!r.ok)throw new Error(String(r.status));return r}
async function gFind(){let id=lsGet('gd-fid');if(id)return id;
 const j=await(await gApi('https://www.googleapis.com/drive/v3/files?fields=files(id)&orderBy=modifiedTime%20desc&q='+encodeURIComponent(`name='${GD.fn}' and trashed=false`))).json();
 id=j.files&&j.files[0]&&j.files[0].id;if(id)lsSet('gd-fid',id);return id||null}
async function gCreate(){S.mod=S.mod||Date.now();const b='ynabb',body=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:GD.fn,mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${snap()}\r\n--${b}--`;
 const j=await(await gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();lsSet('gd-fid',j.id)}
const gPut=id=>gApi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:snap()});
const gBusyUI=()=>UI.adding||UI.txedit||UI.edit||UI.modal||/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
async function gSync(){if(gBusy||gSt==='unavail')return;gBusy=true;gStatus('sync');let again=false;
 try{const id=await gFind();
  if(!id)await gCreate();
  else{const R=await(await gApi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(),lm=S.mod||0,rm=R.mod||0;
   if(S.mod!==(lm||undefined)&&S.mod!==lm){again=true}
   else if(rm>lm){if(gBusyUI()){gStatus('ok');return}S=R;lsSet(K,snap());hist=[];redo=[];render()}
   else if(lm>rm)await gPut(id)}
  gLast=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});lsSet('gd-on','1');gStatus('ok')}
 catch(e){if(e&&e.message==='404'){lsDel('gd-fid');again=true}else gStatus(e&&(e.type||e.error||e.message==='nogsi')?'paused':'err')}
 finally{gBusy=false}
 if(again)return gSync()}
function gPush(){if(gSt==='off'||gSt==='unavail')return;clearTimeout(gTm);gTm=setTimeout(()=>{gSync()},2000)}
function gInit(){const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
 sc.onload=()=>{if(lsGet('gd-on'))gSync()};sc.onerror=()=>gStatus('unavail');document.head.appendChild(sc)}
document.addEventListener('click',()=>{if(lsGet('gd-on')&&!gBusy&&!gAuthP&&(gSt==='paused'||gSt==='err'||(gTok&&Date.now()>=gExp)))gSync()},true);
setInterval(()=>{if(lsGet('gd-on')&&gTok&&Date.now()<gExp)gSync()},45000);
