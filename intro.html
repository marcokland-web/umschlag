<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umschlag – Budget</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#edf1f0;--sf:#fff;--ink:#10232a;--mut:#5b6e73;--ln:#d5dedc;--pos:#0f7a5f;--neg:#b3261e;--ac:#2748d9;--onac:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--sf:#15272e;--ink:#e6eeee;--mut:#92a6aa;--ln:#243a42;--pos:#4fd1a5;--neg:#ff8a80;--ac:#8fa8ff;--onac:#0d1a1f}}
:root[data-theme="dark"]{--bg:#0d1a1f;--sf:#15272e;--ink:#e6eeee;--mut:#92a6aa;--ln:#243a42;--pos:#4fd1a5;--neg:#ff8a80;--ac:#8fa8ff;--onac:#0d1a1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{width:100%;padding:12px clamp(14px,3vw,40px) 110px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.gb{background:var(--sf);border-radius:12px;overflow:hidden}
.gh{display:flex;gap:6px;align-items:center;padding:8px 10px;background:color-mix(in srgb,var(--ink) 7%,var(--sf))}
.gh button{padding:6px 10px}
.row.ed{grid-template-columns:1fr}.row .cn{text-align:left}.acts{display:flex;gap:6px;align-items:center}.acts select{flex:1;min-width:0;padding:6px}.acts button{padding:6px 10px}
.gn{flex:1;min-width:0;font-weight:700;border:0;background:transparent;padding:6px}
@media(min-width:900px){body{font-size:18px}.row{grid-template-columns:1fr 130px 110px}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--onac);font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}
input,select{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar h1{font-size:1.15rem;margin:0;text-transform:capitalize}
.rta{border-radius:16px;padding:16px 18px;margin-bottom:14px;color:#fff;background:var(--pos)}
.rta.z{background:#5b6e73}.rta.n{background:var(--neg)}
.rta b{display:block;font-size:2rem;line-height:1.1;letter-spacing:-.02em}
.grp{margin:16px 2px 4px;font-weight:700;color:var(--mut);font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 92px 84px;gap:8px;align-items:center;background:var(--sf);border-bottom:1px solid var(--ln);padding:8px 10px}
.row:last-child{border-bottom:0}
.row input{padding:6px 8px;text-align:right}
.row small{display:block;color:var(--mut)}
.pill{justify-self:end;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--pos) 18%,transparent);color:var(--pos)}
.pill.n{background:color-mix(in srgb,var(--neg) 18%,transparent);color:var(--neg)}
.pill.z{background:transparent;color:var(--mut)}
.card{background:var(--sf);border-radius:12px;padding:12px;margin-bottom:10px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}.li small{color:var(--mut);display:block}
.neg{color:var(--neg)}.pos{color:var(--pos)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);border-radius:8px}
nav button[aria-current=true]{color:var(--ac)}
.sync{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dot{width:9px;height:9px;border-radius:99px;background:var(--mut)}
.dot.on{background:var(--pos)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:99px;padding:14px 20px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{width:100%;height:90px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:8px;font:12px monospace}
</style></head>
<body><main id="app"></main><script>
const K='umschlag-v1';
const id=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const sum=a=>a.reduce((x,y)=>x+y,0);
function seed(){const gs=['Fixkosten','Alltag','Rücklagen'].map(n=>({id:id(),name:n}));const c=(n,i)=>({id:id(),name:n,gid:gs[i].id});return{accounts:[{id:'acc-default',name:'Girokonto'}],groups:gs,cats:[c('Miete',0),c('Strom & Internet',0),c('Lebensmittel',1),c('Mobilität',1),c('Freizeit',1),c('Notgroschen',2)],asg:{},tx:[]}}
function migrate(j){if(!j.groups){j.groups=[...new Set(j.cats.map(c=>c.group))].map(n=>({id:id(),name:n}));j.cats.forEach(c=>{c.gid=j.groups.find(g=>g.name===c.group).id;delete c.group})}return j}
function load(){try{const j=localStorage.getItem(K);if(j)return migrate(JSON.parse(j))}catch(e){}return seed()}
let S=dedupeAccounts(load()),M=new Date().toISOString().slice(0,7),tab='b',sheet=null,type='out',edit=false;
const CLIENT_ID='764904792444-21vta8qu7edshvdqrsipo5mk185a8kim.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata';
let gToken=null,gFileId=localStorage.getItem('umschlag-fid')||null,gTC=null,gStatus=localStorage.getItem('umschlag-fid')?'Getrennt – bitte erneut verbinden':'Nicht verbunden',gBusy=false,syncTO=null;
function stamp(o){o.ts=now();return o}
function dedupeAccounts(S){
 const seen=new Map();const drop=new Set();
 S.accounts.forEach(a=>{const bal=sum(S.tx.filter(t=>t.acc===a.id).map(t=>t.amt));
  if(bal!==0)return;
  const k=a.name.trim().toLowerCase();
  if(seen.has(k))drop.add(a.id);else seen.set(k,a.id);
 });
 if(drop.size){S.accounts=S.accounts.filter(a=>!drop.has(a.id))}
 return S;
}
function mergeState(a,b){
 const tx=[...a.tx];b.tx.forEach(t=>{if(!tx.some(x=>x.id===t.id))tx.push(t)});
 const asg={...a.asg};Object.entries(b.asg).forEach(([k,v])=>{if(!asg[k]||(v.ts||0)>(asg[k].ts||0))asg[k]=v});
 const byId=(A,B)=>{const m=new Map();A.forEach(x=>m.set(x.id,x));B.forEach(x=>{const c=m.get(x.id);if(!c||(x.ts||0)>(c.ts||0))m.set(x.id,x)});return[...m.values()]};
 return dedupeAccounts({accounts:byId(a.accounts,b.accounts),groups:byId(a.groups,b.groups),cats:byId(a.cats,b.cats),asg,tx});
}
async function gApi(url,opts={}){
 const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+gToken}});
 if(r.status===401){gToken=null;throw{status:401,body:await r.text().catch(()=>'')}}
 if(!r.ok)throw{status:r.status,body:await r.text().catch(()=>'')};
 return r.status===204?null:r.json();
}
async function driveSyncNow(){
 if(!gToken||gBusy)return;gBusy=true;gStatus='Synchronisiere…';render();
 try{
  if(!gFileId){
   const f=await gApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27umschlag.json%27&fields=files(id)');
   if(f.files&&f.files.length)gFileId=f.files[0].id;
  }
  if(gFileId){
   const remote=await fetch('https://www.googleapis.com/drive/v3/files/'+gFileId+'?alt=media',{headers:{Authorization:'Bearer '+gToken}});
   if(remote.ok){const rj=await remote.json();S=mergeState(S,rj);save()}
   await gApi('https://www.googleapis.com/upload/drive/v3/files/'+gFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
  }else{
   const boundary='umschlag';
   const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'umschlag.json',parents:['appDataFolder']})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(S)+'\r\n--'+boundary+'--';
   const created=await gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
   gFileId=created.id;localStorage.setItem('umschlag-fid',gFileId);
  }
  gStatus='Synchronisiert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 }catch(e){
  let msg='Fehler';try{const j=JSON.parse(e.body);msg=(j.error&&(j.error.message||j.error))||e.body}catch(_){msg=e.body||e.message||String(e)}
  gStatus='Fehler ('+(e.status||'?')+'): '+String(msg).slice(0,160);
  console.error('drive sync failed',e);
 }
 gBusy=false;render();
}
function driveConnect(){
 if(!window.google){gStatus='Google-Skript lädt noch, kurz erneut versuchen';render();return}
 if(!gTC)gTC=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:DRIVE_SCOPE,callback:r=>{if(r.error){gStatus='Verbindung abgelehnt';render();return}gToken=r.access_token;driveSyncNow()}});
 gTC.requestAccessToken({prompt:gFileId?'':'consent'});
}
function scheduleSync(){if(!gToken)return;clearTimeout(syncTO);syncTO=setTimeout(driveSyncNow,1200)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}scheduleSync()};
const eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const parse=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round((parseFloat(s)||0)*100)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mo=d=>d.slice(0,7);
const asgTo=(c)=>sum(Object.entries(S.asg).filter(([k])=>k.split('|')[0]<=M&&(!c||k.split('|')[1]===c)).map(([,v])=>v.v));
const rta=()=>sum(S.tx.filter(t=>!t.cat&&mo(t.date)<=M).map(t=>t.amt))-asgTo();
const avail=c=>asgTo(c)+sum(S.tx.filter(t=>t.cat===c&&mo(t.date)<=M).map(t=>t.amt));
const act=c=>sum(S.tx.filter(t=>t.cat===c&&mo(t.date)===M).map(t=>t.amt));
const pill=v=>`<span class="pill ${v<0?'n':v===0?'z':''}">${eur(v)}</span>`;
function shift(d){const [y,m]=M.split('-').map(Number);const x=new Date(y,m-1+d,1);M=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function render(){
 const r=rta(),a=document.getElementById('app');
 const label=new Date(M+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'});
 let h='';
 if(tab==='b'){
  h+=`<div class="bar"><button class="g" data-a="prev" aria-label="Vorheriger Monat">‹</button><h1>${label}</h1><button class="g" data-a="next" aria-label="Nächster Monat">›</button><button class="${edit?'':'g'}" data-a="edit">${edit?'Fertig':'Bearbeiten'}</button></div>
  <div class="rta ${r<0?'n':r===0?'z':''}"><span>${r<0?'Zu viel verteilt':r===0?'Alles verteilt':'Noch zu verteilen'}</span><b>${eur(r)}</b></div>`;
  h+='<div class="groups">';
  S.groups.forEach(g=>{const cs=S.cats.filter(c=>c.gid===g.id);
   h+=`<section class="gb">`+(!edit?`<div class="gh"><b class="gn">${esc(g.name)}</b></div>`:`<div class="gh"><input class="gn" data-g="${g.id}" value="${esc(g.name)}" aria-label="Name der Oberkategorie"><button class="g" data-gm="${g.id}|-1" aria-label="Nach vorne">↑</button><button class="g" data-gm="${g.id}|1" aria-label="Nach hinten">↓</button>${cs.length?'':`<button class="g" data-gd="${g.id}" aria-label="Oberkategorie löschen">✕</button>`}</div>`);
   cs.forEach(c=>{const s=S.asg[M+'|'+c.id];
    if(edit){const used=S.tx.some(t=>t.cat===c.id)||Object.keys(S.asg).some(k=>k.endsWith('|'+c.id)&&S.asg[k].v);
     h+=`<div class="row ed"><input class="cn" data-cn="${c.id}" value="${esc(c.name)}" aria-label="Name der Kategorie"><div class="acts"><button class="g" data-cm="${c.id}|-1" aria-label="Nach oben">↑</button><button class="g" data-cm="${c.id}|1" aria-label="Nach unten">↓</button><select data-cg="${c.id}" aria-label="Oberkategorie">${S.groups.map(x=>`<option value="${x.id}"${x.id===c.gid?' selected':''}>${esc(x.name)}</option>`).join('')}</select>${used?'':`<button class="g" data-cd="${c.id}" aria-label="Kategorie löschen">✕</button>`}</div></div>`;return}
    h+=`<div class="row"><div>${esc(c.name)}<small>Ausgaben ${eur(-act(c.id))}</small></div>
    <input inputmode="decimal" aria-label="Budget für ${esc(c.name)}" data-c="${c.id}" value="${s&&s.v?(s.v/100).toFixed(2).replace('.',','):''}" placeholder="0,00">${pill(avail(c.id))}</div>`});h+='</section>'});h+='</div>';
  if(edit)h+=`<div class="two" style="margin-top:16px"><form class="card" data-f="grp"><input name="n" placeholder="Neue Oberkategorie" required><button style="margin-top:8px">Oberkategorie hinzufügen</button></form><form class="card" data-f="cat"><div class="two"><input name="n" placeholder="Neue Kategorie" required><select name="g" aria-label="Oberkategorie">${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><button style="margin-top:8px">Kategorie hinzufügen</button></form></div>`;
 }
 if(tab==='t'){
  const L=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts);
  h+=`<div class="bar"><h1>Buchungen</h1></div><div class="card">${L.length?L.map(t=>{const c=S.cats.find(c=>c.id===t.cat),ac=S.accounts.find(x=>x.id===t.acc);
   return `<div class="li"><div>${esc(t.memo||(c?c.name:'Einnahme'))}<small>${t.date} · ${esc(ac?ac.name:'')} · ${c?esc(c.name):'Einnahme'}</small></div><div><span class="${t.amt<0?'neg':'pos'}">${eur(t.amt)}</span> <button class="g" data-del="${t.id}" aria-label="Buchung löschen">✕</button></div></div>`}).join(''):'Noch keine Buchungen. Tippe auf „+ Buchung“, um die erste zu erfassen.'}</div>`;
 }
 if(tab==='k'){
  h+=`<div class="bar"><h1>Konten</h1></div><div class="card">${S.accounts.map(x=>{const bal=sum(S.tx.filter(t=>t.acc===x.id).map(t=>t.amt)),used=S.tx.some(t=>t.acc===x.id);return `<div class="li"><span>${esc(x.name)}</span><span>${eur(bal)}${used?'':` <button class="g" data-accd="${x.id}" aria-label="Konto löschen">✕</button>`}</span></div>`}).join('')}<div class="li"><span>Gesamt</span><b>${eur(sum(S.tx.map(t=>t.amt)))}</b></div></div>
  <form class="card" data-f="acc"><div class="two"><input name="n" placeholder="Kontoname" required><input name="s" inputmode="decimal" placeholder="Anfangssaldo"></div><button style="margin-top:8px">Konto hinzufügen</button></form>
  <div class="card sync"><div><b>Google Drive</b><br><span style="color:var(--mut);word-break:break-word"><span class="dot${gToken?' on':''}"></span> ${esc(gStatus)}</span></div><button class="${gToken?'g':''}" data-a="drive">${gToken?'Jetzt synchronisieren':'Mit Google verbinden'}</button></div>
  <div class="card"><b>Daten (JSON)</b><p style="color:var(--mut);margin:4px 0 8px">Kopiere den Inhalt als Sicherung. Zum Wiederherstellen einfügen und übernehmen.</p><textarea id="js">${esc(JSON.stringify(S))}</textarea><button class="g" data-a="imp" style="margin-top:8px">Übernehmen</button></div>`;
 }
 h+=`<button class="fab" data-a="new">+ Buchung</button><nav>${[['b','Budget'],['t','Buchungen'],['k','Konten']].map(([k,n])=>`<button data-tab="${k}" aria-current="${tab===k}">${n}</button>`).join('')}</nav>`;
 if(sheet)h+=`<div class="sheet" data-a="close"><div><form data-f="tx" style="display:grid;gap:10px"><div class="seg"><button type="button" class="${type==='out'?'':'g'}" data-type="out">Ausgabe</button><button type="button" class="${type==='in'?'':'g'}" data-type="in">Einnahme</button></div>
  <input name="a" inputmode="decimal" placeholder="Betrag in €" required autofocus>
  ${type==='out'?`<select name="c" aria-label="Kategorie">${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''}
  <div class="two"><select name="k" aria-label="Konto">${S.accounts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input name="d" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
  <input name="m" placeholder="Notiz (optional)"><button>Speichern</button></form></div></div>`;
 a.innerHTML=h;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-tab],[data-type],[data-del],[data-gm],[data-gd],[data-cm],[data-cd],[data-accd]');if(!t)return;
 if(t.dataset.a==='close'&&e.target!==t)return;
 if(t.dataset.tab){tab=t.dataset.tab}
 else if(t.dataset.type){type=t.dataset.type}
 else if(t.dataset.del){S.tx=S.tx.filter(x=>x.id!==t.dataset.del);save()}
 else if(t.dataset.gm){const [g,d]=t.dataset.gm.split('|'),i=S.groups.findIndex(x=>x.id===g),j=i+ +d;if(j>=0&&j<S.groups.length){[S.groups[i],S.groups[j]]=[S.groups[j],S.groups[i]];save()}}
 else if(t.dataset.gd){S.groups=S.groups.filter(x=>x.id!==t.dataset.gd);save()}
 else if(t.dataset.cm){const [c,d]=t.dataset.cm.split('|'),o=S.cats.find(x=>x.id===c),cs=S.cats.filter(x=>x.gid===o.gid),i=cs.indexOf(o),j=i+ +d;if(j>=0&&j<cs.length){const a=S.cats.indexOf(cs[i]),b=S.cats.indexOf(cs[j]);[S.cats[a],S.cats[b]]=[S.cats[b],S.cats[a]];save()}}
 else if(t.dataset.cd){S.cats=S.cats.filter(x=>x.id!==t.dataset.cd);save()}
 else if(t.dataset.a==='edit')edit=!edit;
 else if(t.dataset.a==='drive')driveConnect();
 else if(t.dataset.accd){S.accounts=S.accounts.filter(x=>x.id!==t.dataset.accd);save()}
 else if(t.dataset.a==='prev')shift(-1);
 else if(t.dataset.a==='next')shift(1);
 else if(t.dataset.a==='new')sheet=1;
 else if(t.dataset.a==='close')sheet=null;
 else if(t.dataset.a==='imp'){try{const j=JSON.parse(document.getElementById('js').value);if(j.accounts&&j.cats&&j.tx){S=migrate(j);save()}}catch(x){}}
 render();
});
document.addEventListener('change',e=>{
 const cn=e.target.dataset.cn,cg=e.target.dataset.cg;
 if(cn||cg){const o=S.cats.find(x=>x.id===(cn||cg)),v=e.target.value.trim();if(o&&v){if(cn)o.name=v;else{o.gid=v;S.cats=S.cats.filter(x=>x!==o);S.cats.push(o)}stamp(o);save()}render();return}
 const g=e.target.dataset.g;
 if(g){const o=S.groups.find(x=>x.id===g),v=e.target.value.trim();if(o&&v){o.name=v;stamp(o);save()}render();return}
 const c=e.target.dataset.c;if(!c)return;
 S.asg[M+'|'+c]={v:parse(e.target.value),ts:now()};save();render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,d=new FormData(f),k=f.dataset.f;
 if(k==='cat'){if(!d.get('g'))return;S.cats.push(stamp({id:id(),name:d.get('n'),gid:d.get('g')}))}
 if(k==='grp')S.groups.push(stamp({id:id(),name:d.get('n')}));
 if(k==='acc'){const i=id();S.accounts.push({id:i,name:d.get('n')});const s=parse(d.get('s'));if(s)S.tx.push({id:id(),date:new Date().toISOString().slice(0,10),acc:i,cat:null,amt:s,memo:'Anfangssaldo',ts:now()})}
 if(k==='tx'){const v=parse(d.get('a'));if(!v)return;S.tx.push({id:id(),date:d.get('d'),acc:d.get('k'),cat:type==='out'?d.get('c'):null,amt:type==='out'?-Math.abs(v):Math.abs(v),memo:d.get('m'),ts:now()});sheet=null;M=mo(d.get('d'))}
 save();render();
});
